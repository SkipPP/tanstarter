services:
  db:
    image: postgres:latest
    container_name: crowdsec-dashboard-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-crowdsec-dashboard-db}
    ports:
      - "5432:5432"
    volumes:
      - crowdsec-dashboard-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crowdsec-network

volumes:
  crowdsec-dashboard-database-data:

networks:
  crowdsec-network:
    driver: bridge