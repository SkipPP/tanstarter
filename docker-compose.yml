services:
  db:
    image: postgres:18
    container_name: tanstarter-database
    restart: unless-stopped
    env_file:
      - ./packages/db/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-tanstarter-database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tanstarter-database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tanstarter-network

volumes:
  tanstarter-database-data:

networks:
  tanstarter-network:
    driver: bridge
